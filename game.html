/* وضع التشخيص: افتح الرابط مع ?debug=1 لعرض سبب عدم ظهور زر التثبيت */

    log('id='+m.id+' | start_url='+m.start_url+' | scope='+m.scope+' | display='+m.display);
    (m.icons||[]).forEach(function(ic){var u=new URL(ic.src,location.href).href;
      fetch(u).then(function(r){log('icon '+ic.sizes+' HTTP '+r.status+' '+r.headers.get('content-type'));return r.blob()}).then(function(b){
        var im=new Image();im.onload=function(){log('icon real size '+im.naturalWidth+'x'+im.naturalHeight+' ('+b.size+' bytes)')};im.onerror=function(){log('icon DECODE FAILED')};im.src=URL.createObjectURL(b)}).catch(function(e){log('icon error '+e)})})
