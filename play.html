<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ألعاب الصغار</title>
<meta name="description" content="ثبّت اللعبة على جهازك بضغطة واحدة">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ألعاب الصغار">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="ألعاب الصغار">
<meta property="og:description" content="ثبّت اللعبة على جهازك بضغطة واحدة">
<meta property="og:url" content="https://store.wqargroup.com/play">
<meta property="og:image" content="https://store.wqargroup.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ألعاب الصغار">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ألعاب الصغار">
<meta name="twitter:description" content="ثبّت اللعبة على جهازك بضغطة واحدة">
<meta name="twitter:image" content="https://store.wqargroup.com/og-image.jpg">
<style>
:root{--bg:#fff8e7;--card:#fff;--text:#2b2350;--muted:#6b6490;--brand:#7c4dff;--line:#eadfc8}
@media(prefers-color-scheme:dark){:root{--bg:#1b1636;--card:#272048;--text:#f4f0ff;--muted:#b3a9d9;--brand:#a98bff;--line:#3a3166}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:2px solid var(--line);box-shadow:0 4px 18px rgba(124,77,255,.14);animation:hdrIn .6s cubic-bezier(.2,.9,.3,1.2) both;transition:box-shadow .25s ease}
/* ارتفاع الهيدر ثابت: التصغير بصري فقط (scale) كي لا يتحرك المحتوى تحته فيهتز التمرير */
header.sm{box-shadow:0 2px 10px rgba(124,77,255,.12)}
#logo{width:48px;height:48px;object-fit:contain;border-radius:14px;flex:none;animation:logoFloat 3.2s ease-in-out infinite;transition:scale .25s ease}
header.sm #logo{scale:.78}
h1{margin:0;font-size:clamp(18px,4.6vw,26px);line-height:1.2;background:linear-gradient(90deg,var(--brand),#ff6ec7,#4fc3f7,var(--brand));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:nameShine 6s linear infinite}
@keyframes hdrIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes nameShine{to{background-position:-250% 0}}
@media(prefers-reduced-motion:reduce){header,#logo,h1{animation:none}}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:10px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chips .chip:first-child{margin-inline-start:auto}.chips .chip:last-child{margin-inline-end:auto}
.chip{flex:none;white-space:nowrap;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:760px;margin:auto;padding:8px 16px 40px;display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:row;align-items:center;gap:14px;padding:12px}
.card img{width:120px;height:90px;flex:none;object-fit:cover;border-radius:16px;background:var(--line)}
.body{padding:0;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.body h3{margin:0}.body p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.acts{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;flex:none}
@media(max-width:560px){.card{flex-wrap:wrap}.card img{width:84px;height:84px}.body{flex:1 1 calc(100% - 110px)}.acts{width:100%}}.tag{font-size:12px;color:var(--muted)}
.ab{min-width:0;min-height:48px;padding:8px 16px;border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:16px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.ab svg{flex:none}
.ab:active{transform:translateY(3px)}
.ab.play{background:linear-gradient(#8ef08e,#2fbf4f);box-shadow:0 4px 0 #23913b,0 8px 14px rgba(0,0,0,.18)}
/* فتح في نافذة: مربع باهت على قدر الأيقونة فقط بلا نص */
.ab.win{min-height:0;padding:8px;border-radius:10px;background:rgba(3,155,229,.14);color:#0277bd;box-shadow:none;text-shadow:none}
.ab.win:active{transform:scale(.92)}
#inst{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);width:42px;height:42px;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(#a98bff,#7c4dff);box-shadow:0 3px 0 #5a35c7}
#inst[hidden]{display:none}
#ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,12,50,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ov[hidden]{display:none}
#ovc{position:relative;width:100%;max-width:340px;padding:34px 22px 28px;border-radius:28px;text-align:center;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:ovIn .45s ease both}
#ovlg{display:block;width:112px;height:112px;object-fit:contain;border-radius:26px;margin:0 auto 22px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
#ovlg[hidden]{display:none}
#ovb{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;margin:0 auto;padding:10px 26px;border:0;border-radius:99px;font:inherit;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(#ff8fb1,#ff4f87);box-shadow:0 5px 0 #c9336a,0 10px 18px rgba(0,0,0,.25);cursor:pointer;animation:ovP 1.6s ease-in-out infinite}
#ovb .ovi{display:inline-flex;width:36px;height:36px;border-radius:50%;background:#fff;align-items:center;justify-content:center;flex:none;animation:ovB 1.6s ease-in-out infinite}
#ovx{position:absolute;top:10px;inset-inline-end:10px;width:32px;height:32px;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.28);cursor:pointer}
@media(prefers-reduced-motion:reduce){#ovb,#ovb .ovi,#ovc{animation:none}}
#toast{position:fixed;inset-inline:16px;bottom:22px;z-index:300;max-width:420px;margin:auto;padding:12px 16px;border-radius:16px;background:var(--text);color:var(--bg);font-size:15px;line-height:1.7;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:opacity .3s ease}
#toast[hidden]{display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted)}
@keyframes ovIn{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes ovP{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes ovB{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style><link rel="manifest" href="/api/manifest"></head><body>
<header id="hdr"><img id="logo" alt="" hidden><h1 id="nm"></h1>
<button id="inst" type="button" hidden aria-label="تثبيت المتجر" title="تثبيت المتجر"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M6.5 10.5 12 16l5.5-5.5"/><path d="M5 20h14"/></svg></button></header>
<div class="chips" id="chips"></div><main id="grid"></main><div id="ov" hidden><div id="ovc"><button id="ovx" type="button" aria-label="إغلاق"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><img id="ovlg" alt="" hidden><button id="ovb" type="button" aria-label="تثبيت المتجر"><span class="ovi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff4f87" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M6.5 10.5 12 16l5.5-5.5"/><path d="M5 20h14"/></svg></span><span>تثبيت</span></button></div></div><div id="toast" role="status" hidden></div>
<script>
var D={site:{name:'ألعاب الصغار',desc:'',logo:'',tabs:[]},games:[]},cur='الكل';
fetch('games.json').then(r=>r.json()).then(d=>{
  if(Array.isArray(d))d={site:D.site,games:d};D=d;head();render()}).catch(()=>{head();render()});
function head(){var s=D.site;document.title=s.name;
  document.getElementById('nm').textContent=s.name;
  var l=document.getElementById('logo');if(s.logo){l.src=s.logo;l.hidden=false;
    var ol=document.getElementById('ovlg');ol.src=s.logo;ol.hidden=false;
    var f=document.querySelector('link[rel=icon]')||document.head.appendChild(Object.assign(document.createElement('link'),{rel:'icon'}));f.href=s.logo}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
function slug(u){try{return new URL(u).hostname.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}catch(e){return ''}}
var IC_PLAY='<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  IC_WIN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
var UA=navigator.userAgent||'',
  MOB=/Android|iPhone|iPad|iPod|Mobile/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  IOS=/iphone|ipad|ipod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  INAPP=/FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat|TikTok|Telegram|WhatsApp|; wv\)/i.test(UA),
  standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
/* تشغيل: على الموبايل تُفتح اللعبة داخل المتجر (/game) بتلاشٍ ولا يخرج المستخدم منه. الحاسوب: يفتح موقع اللعبة مباشرةً */
function play(g){var u=MOB?'/game?id='+encodeURIComponent(slug(g.url))+'&from=store':g.url,b=document.body;
  b.style.transition='opacity .45s ease';b.style.opacity='0';setTimeout(function(){location.href=u},450)}
/* فتح في نافذة أخرى: يفتح موقع اللعبة كصفحة ويب عادية في المتصفح خارج المتجر، وهناك يظهر تثبيتها المستقل إن كانت تدعمه.
   أندرويد والمتجر مثبّت: الرابط العادي يُفتح في Custom Tab داخل المتجر، لذا نستعمل intent:// لفتحه في Chrome نفسه (مع رابط احتياطي) */
function openWin(g){
  var done=false;
  if(standalone&&/Android/i.test(UA)&&!INAPP){
    try{var x=new URL(g.url);
      location.href='intent://'+x.host+x.pathname+x.search+x.hash+'#Intent;scheme='+x.protocol.replace(':','')+';package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(g.url)+';end';
      done=true}catch(e){}}
  if(!done){var a=document.createElement('a');a.href=g.url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
  var seen=false;try{seen=localStorage.getItem('pk_tip_win')==='1';localStorage.setItem('pk_tip_win','1')}catch(e){}
  if(!seen)toast('فُتحت اللعبة في المتصفح. لتثبيتها كتطبيق مستقل اختر «تثبيت التطبيق» من قائمة المتصفح.',9000)}
var tt=null;
function toast(t,ms){var e=document.getElementById('toast');e.textContent=t;e.hidden=false;e.style.opacity='1';clearTimeout(tt);
  tt=setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.hidden=true},300)},ms||6000)}
/* تثبيت المتجر نفسه: الوحيد المتاح هنا */
var evp=null,ib=document.getElementById('inst'),ov=document.getElementById('ov'),t2=false,ovDone=false;
try{ovDone=sessionStorage.getItem('pk_ov_x')==='1'}catch(e){}
function howText(){
  if(INAPP)return 'أنت تفتح الصفحة داخل متصفح تطبيق آخر (مثل واتساب أو فيسبوك) ولا يدعم التثبيت. افتح هذا الرابط في Chrome أو Safari ثم اضغط «تثبيت».';
  if(IOS)return 'في iPhone / iPad: اضغط زر المشاركة (المربع والسهم) في Safari ثم اختر «إضافة إلى الشاشة الرئيسية».';
  return 'اضغط قائمة المتصفح (⋮) ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». وإن كان المتجر مثبّتًا لديك فافتحه من الشاشة الرئيسية.'}
function showOv(){if(standalone||ovDone||!ov.hidden)return;ov.hidden=false}
function closeOv(){ov.hidden=true;ovDone=true;try{sessionStorage.setItem('pk_ov_x','1')}catch(e){}}
async function doInstall(){
  if(!evp){toast(howText(),10000);return}
  var ev=evp;evp=null;
  try{ev.prompt();var c=await ev.userChoice;if(c&&c.outcome==='accepted')ov.hidden=true;else closeOv()}catch(e){closeOv()}}
if(!standalone)ib.hidden=false;
ib.onclick=doInstall;document.getElementById('ovb').onclick=doInstall;document.getElementById('ovx').onclick=closeOv;
ov.onclick=function(e){if(e.target===ov)closeOv()};
/* بعد ثانيتين من فتح المتجر تظهر نافذة التثبيت لغير المثبّتين فقط: كروم لا يطلق حدث التثبيت إن كان المتجر مثبّتًا فننتظر الحدث، وiPhone ومتصفحات التطبيقات لا تطلقه أبدًا فنعرضها لها مباشرة */
setTimeout(function(){t2=true;if(evp||IOS||INAPP)showOv()},2000);
addEventListener('beforeinstallprompt',function(e){e.preventDefault();evp=e;if(!standalone)ib.hidden=false;if(t2)showOv()});
addEventListener('appinstalled',function(){evp=null;ib.hidden=true;ov.hidden=true});
addEventListener('pageshow',function(){document.body.style.opacity='1'});
var hdr=document.getElementById('hdr'),hsm=false;
addEventListener('scroll',function(){   /* حدّان مختلفان (30 و10) حتى لا يتبدّل الوضع عند الحافة */
  if(!hsm&&scrollY>30){hsm=true;hdr.classList.add('sm')}else if(hsm&&scrollY<10){hsm=false;hdr.classList.remove('sm')}
},{passive:true});
function render(){
  var tabs=['الكل'].concat(D.site.tabs||[]);
  var ch=document.getElementById('chips'),sl=ch.scrollLeft;ch.innerHTML='';
  tabs.forEach(a=>{var b=document.createElement('button');b.className='chip'+(a===cur?' on':'');b.textContent=a;b.onclick=()=>{cur=a;render()};ch.appendChild(b)});
  ch.scrollLeft=sl;   /* يبقى التمرير مكانه بعد إعادة البناء، ثم يظهر التبويب المحدد كاملًا */
  var on=ch.querySelector('.on');if(on){var r=on.getBoundingClientRect(),c=ch.getBoundingClientRect();if(r.left<c.left)ch.scrollLeft-=c.left-r.left+16;else if(r.right>c.right)ch.scrollLeft+=r.right-c.right+16}
  var gr=document.getElementById('grid');gr.innerHTML='';
  var L=D.games.filter(g=>cur==='الكل'||g.tab===cur);
  if(!L.length){gr.innerHTML='<p class="empty">لا توجد ألعاب بعد.</p>';return}
  L.forEach(g=>{
    var c=document.createElement('div');c.className='card';
    c.innerHTML='<img alt=""><div class="body"><h3></h3><p></p><div class="tag"></div></div><div class="acts"><button type="button" class="ab play" aria-label="تشغيل" title="تشغيل"></button><button type="button" class="ab win" aria-label="فتح في نافذة أخرى" title="فتح في نافذة أخرى"></button></div>';
    var im=c.querySelector('img');im.src=g.image||g.icon||'';im.onerror=()=>{im.style.visibility='hidden'};
    c.querySelector('h3').textContent=g.name;c.querySelector('p').textContent=g.desc;
    c.querySelector('.tag').textContent=g.tab||'';
    var bp=c.querySelector('.ab.play'),bw=c.querySelector('.ab.win');
    bp.innerHTML=IC_PLAY+'<span>تشغيل</span>';bw.innerHTML=IC_WIN;
    bp.onclick=()=>play(g);bw.onclick=()=>openWin(g);
    gr.appendChild(c)});
}
</script></body></html>
