<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>لعبة</title>
<style>html,body{margin:0;height:100%;background:#1b1636}iframe{border:0;width:100%;height:100%;display:block}
#msg{color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif;text-align:center;padding:40px}</style></head>
<body><div id="msg">جارٍ التحميل...</div>
<script>
function slug(u){try{return new URL(u).hostname.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}catch(e){return ''}}
function msg(t){var m=document.getElementById('msg');if(m)m.textContent=t}
var id=new URLSearchParams(location.search).get('id')||'';
fetch('/games.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){
  var G=Array.isArray(d)?d:(d.games||[]);
  var g=G.filter(function(x){return slug(x.url)===id})[0];
  if(!g){msg('اللعبة غير موجودة');return}
  document.title=g.name;
  var l=document.createElement('link');l.rel='manifest';l.href='/api/manifest?id='+encodeURIComponent(id);document.head.appendChild(l);
  var ic=g.icon||g.image;if(ic){var a=document.createElement('link');a.rel='apple-touch-icon';a.href=ic;document.head.appendChild(a)}
  var f=document.createElement('iframe');f.src=g.url;f.title=g.name;
  f.allow='fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write; microphone';
  f.setAttribute('allowfullscreen','');
  document.body.innerHTML='';document.body.appendChild(f);
}).catch(function(){msg('تعذر التحميل')});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
</script></body></html>
