<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--text:#2b2350;--muted:#6b6490;--brand:#7c4dff;--line:#ddd6f5;--bad:#d84343;--ok:#2e9d5b}
@media(prefers-color-scheme:dark){:root{--bg:#1b1636;--card:#272048;--text:#f4f0ff;--muted:#b3a9d9;--brand:#a98bff;--line:#3a3166}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:16px}
.w{max-width:760px;margin:auto;display:grid;gap:14px}.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
h1,h2{margin:0}label{font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit}
.row{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;color:#fff;background:var(--brand);cursor:pointer;white-space:nowrap}
.btn.g{background:var(--line);color:var(--text)}.btn.d{background:var(--bad)}
.pv{display:flex;gap:12px;align-items:flex-start}.pv img{width:140px;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--line)}
.f{flex:1;display:grid;gap:8px}.box[hidden],.pn[hidden]{display:none}.pn{display:grid;gap:10px}.st{font-size:13px}.ok{color:var(--ok)}.no{color:var(--bad)}
.item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}.item img{width:64px;height:40px;object-fit:cover;border-radius:8px}.item b{flex:1}.item select{width:auto}
#lg{width:84px;height:84px;object-fit:contain;border-radius:18px;background:var(--line)}
</style></head><body><div class="box" id="lock" style="max-width:360px;margin:60px auto">
  <h2>🔒 تسجيل الدخول</h2>
  <input id="us" placeholder="اسم المستخدم" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="btn" id="lg2">دخول</button>
  <div class="st no" id="le"></div>
</div>
<div class="w" id="app" style="display:none">
<h1>⚙️ لوحة التحكم</h1>

<div class="box"><div class="row" style="justify-content:space-between"><h2>إعدادات الموقع</h2><button class="btn g" id="t1">تعديل</button></div><div class="pn" id="p1" hidden>
  <div><label>اسم الموقع</label><input id="sn"></div>
  <div><label>الوصف</label><textarea id="sd" rows="2"></textarea></div>
  <div><label>الشعار</label>
    <div class="row"><img id="lg" alt=""><div class="f">
      <input id="lf" type="file" accept="image/*">
      <input id="lu" type="url" dir="ltr" placeholder="أو رابط صورة https://...">
      <button class="btn d" id="lx">إزالة الشعار</button></div></div></div>
  <div><label>التبويبات (تظهر في المتجر لتصفية الألعاب)</label><div id="tabs" style="display:grid;gap:8px"></div>
    <div class="row" style="margin-top:8px"><input id="tn" placeholder="تبويب جديد"><button class="btn" id="ta">➕ إضافة</button></div></div></div>
</div>

<button class="btn" id="t2">➕ إضافة لعبة</button>
<div class="box" id="p2" hidden><h2>إضافة لعبة</h2>
  <div class="row"><input id="u" type="url" placeholder="https://my-game.vercel.app" dir="ltr"><button class="btn" id="go">جلب</button></div>
  <div class="st" id="st"></div>
  <div class="pv" id="pv" hidden><img id="im" alt=""><div class="f">
    <input id="n" placeholder="اسم اللعبة"><textarea id="d" rows="2" placeholder="الوصف"></textarea>
    <select id="a"></select>
    <button class="btn" id="add">➕ إضافة للمتجر</button></div></div>
</div>

<div class="box"><div class="row" style="justify-content:space-between"><h2>الألعاب الحالية</h2><button class="btn g" id="t3">تعديل</button></div><div class="pn" id="p3" hidden><div id="list"></div></div>
  <button class="btn" id="pub">🚀 نشر الآن</button>
  <div class="st" id="ps"></div>
  <div class="row"><button class="btn g" id="cp">نسخ</button></div>
  <div class="st">زر «نشر الآن» يرسل التعديلات إلى GitHub ثم يعيد Vercel النشر تلقائياً (تظهر بعد دقيقة تقريباً). التنزيل والنسخ للنسخ الاحتياطي فقط. التعديلات تُحفظ مسودةً في متصفحك إلى ذلك الحين.</div></div>
</div>
<script>
var CRED=null,$=id=>document.getElementById(id),KEY='store_draft',cur=null,
D={site:{name:'ألعاب الصغار',desc:'',logo:'',tabs:['3-5','6-8','9-12']},games:[]};
function norm(d){if(Array.isArray(d))d={site:D.site,games:d};d.site=Object.assign({},D.site,d.site||{});d.games=d.games||[];d.games.forEach(g=>{if(!g.tab&&g.age){g.tab=g.age;if(!d.site.tabs.includes(g.tab))d.site.tabs.push(g.tab)}});return d}
var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(saved){D=norm(saved);ui()}else fetch('games.json').then(r=>r.json()).then(d=>{D=norm(d);ui()}).catch(ui);
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}ui()}
function opts(sel,v){sel.innerHTML='';D.site.tabs.forEach(t=>{var o=document.createElement('option');o.textContent=t;o.value=t;sel.appendChild(o)});if(v)sel.value=v}

function ui(){
  var s=D.site;$('sn').value=s.name;$('sd').value=s.desc;$('lg').src=s.logo||'';$('lu').value=/^data:/.test(s.logo||'')?'':(s.logo||'');
  var T=$('tabs');T.innerHTML='';
  s.tabs.forEach((t,i)=>{var r=document.createElement('div');r.className='row';
    r.innerHTML='<input><button class="btn d">حذف</button>';var inp=r.querySelector('input');inp.value=t;
    inp.onchange=()=>{var nv=inp.value.trim();if(!nv||s.tabs.includes(nv)){inp.value=t;return}
      D.games.forEach(g=>{if(g.tab===t)g.tab=nv});s.tabs[i]=nv;save()};
    r.querySelector('button').onclick=()=>{if(!confirm('حذف التبويب «'+t+'»؟ ستبقى ألعابه بلا تبويب.'))return;
      D.games.forEach(g=>{if(g.tab===t)g.tab=''});s.tabs.splice(i,1);save()};
    T.appendChild(r)});
  opts($('a'));
  var l=$('list');l.innerHTML=D.games.length?'':'<div class="st">لا توجد ألعاب.</div>';
  D.games.forEach((g,i)=>{var d=document.createElement('div');d.className='item';
    d.innerHTML='<img alt=""><b></b><span class="st"></span><select></select><button class="btn d">حذف</button>';
    d.querySelector('img').src=g.image||'';d.querySelector('b').textContent=g.name;
    d.querySelector('.st').textContent=g.pwa?'✓ PWA':'✗ غير PWA';
    var se=d.querySelector('select');opts(se);var e=document.createElement('option');e.value='';e.textContent='بلا تبويب';se.appendChild(e);se.value=g.tab||'';
    se.onchange=()=>{g.tab=se.value;save()};
    d.querySelector('.btn').onclick=()=>{D.games.splice(i,1);save()};l.appendChild(d)})}

function tg(b,p,o,c){b.onclick=function(){var h=p.hidden;p.hidden=!h;b.textContent=h?c:o}}
tg($('t1'),$('p1'),'تعديل','إغلاق');tg($('t2'),$('p2'),'➕ إضافة لعبة','✕ إغلاق');tg($('t3'),$('p3'),'تعديل','إغلاق');
$('sn').onchange=()=>{D.site.name=$('sn').value.trim()||D.site.name;save()};
$('sd').onchange=()=>{D.site.desc=$('sd').value.trim();save()};
$('lu').onchange=()=>{D.site.logo=$('lu').value.trim();save()};
$('lx').onclick=()=>{D.site.logo='';save()};
$('lf').onchange=e=>{var f=e.target.files[0];if(!f)return;var im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{var k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    D.site.logo=c.toDataURL('image/png');URL.revokeObjectURL(u);save()};im.src=u};
$('ta').onclick=()=>{var v=$('tn').value.trim();if(!v||D.site.tabs.includes(v))return;D.site.tabs.push(v);$('tn').value='';save()};

$('go').onclick=async()=>{
  var u=$('u').value.trim();if(!u)return;var s=$('st');s.className='st';s.textContent='جارٍ الجلب...';$('pv').hidden=true;
  if(!CRED){location.reload();return}var pw=CRED.p,us=CRED.u;
  try{var r=await fetch('/api/meta?url='+encodeURIComponent(u),{headers:H(us,pw)});
    if(r.status===401){location.reload();return}
    var m=await r.json();if(!r.ok)throw 0;
    cur=m;$('im').src=m.image||'';$('n').value=m.title;$('d').value=m.description;$('pv').hidden=false;
    s.className='st '+(m.pwa?'ok':'no');
    s.textContent=m.pwa?'✓ اللعبة قابلة للتثبيت (manifest موجود)':'✗ لم يُعثر على manifest صالح، لن يعمل التثبيت حتى تضيفه';
  }catch(e){s.className='st no';s.textContent='تعذر جلب الرابط. تأكد منه.'}};
$('add').onclick=()=>{if(!cur)return;D.games.push({name:$('n').value||cur.title,desc:$('d').value,tab:$('a').value,url:cur.url,image:cur.image,icon:cur.icon,pwa:cur.pwa});
  save();$('pv').hidden=true;$('u').value='';$('st').textContent='تمت الإضافة ✓';cur=null};
$('cp').onclick=()=>navigator.clipboard.writeText(JSON.stringify(D,null,2));

$('pub').onclick=async()=>{var s=$('ps');s.className='st';s.textContent='جارٍ النشر...';
  var pw=CRED&&CRED.p,us=CRED&&CRED.u;
  try{var r=await fetch('/api/publish',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H(us,pw)),body:JSON.stringify(D)});
    var j={};try{j=await r.json()}catch(e){}
    if(r.status===401){location.reload();return}
    if(r.ok){s.className='st ok';s.textContent='✓ أُرسلت التعديلات إلى GitHub. سيعيد Vercel النشر وتظهر بعد دقيقة تقريباً.'}
    else{s.className='st no';s.textContent='تعذر النشر: '+(j.error||r.status)}
  }catch(e){s.className='st no';s.textContent='تعذر الاتصال بالخادم.'}};
function H(u,p){return{'x-admin-user':encodeURIComponent(u),'x-admin-password':encodeURIComponent(p)}}
async function login(u,p){try{var r=await fetch('/api/meta?check=1',{headers:H(u,p)});
  if(r.ok){CRED={u:u,p:p};$('lock').style.display='none';$('app').style.display='grid';return true}}catch(e){}
  CRED=null;return false}
$('lg2').onclick=async()=>{$('le').textContent='';if(!await login($('us').value.trim(),$('pw').value))$('le').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lg2').onclick()};
try{sessionStorage.clear()}catch(e){}
addEventListener('pageshow',function(e){if(e.persisted)location.reload()});
</script></body></html>
