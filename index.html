<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر ألعاب الأطفال</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--text:#2b2350;--muted:#6b6490;--brand:#7c4dff;--line:#eadfc8}
@media(prefers-color-scheme:dark){:root{--bg:#1b1636;--card:#272048;--text:#f4f0ff;--muted:#b3a9d9;--brand:#a98bff;--line:#3a3166}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:2px solid var(--line);box-shadow:0 4px 18px rgba(124,77,255,.14);animation:hdrIn .6s cubic-bezier(.2,.9,.3,1.2) both;transition:padding .25s ease,box-shadow .25s ease}
header.sm{padding:6px 16px}
#logo{width:48px;height:48px;object-fit:contain;border-radius:14px;flex:none;animation:logoFloat 3.2s ease-in-out infinite;transition:width .25s ease,height .25s ease}
header.sm #logo{width:36px;height:36px}
h1{margin:0;font-size:clamp(18px,4.6vw,26px);line-height:1.2;background:linear-gradient(90deg,var(--brand),#ff6ec7,#4fc3f7,var(--brand));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:nameShine 6s linear infinite}
@keyframes hdrIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes nameShine{to{background-position:-250% 0}}
@media(prefers-reduced-motion:reduce){header,#logo,h1{animation:none}}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:760px;margin:auto;padding:8px 16px 40px;display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:row;align-items:center;gap:14px;padding:12px}
.card img{width:120px;height:90px;flex:none;object-fit:cover;border-radius:16px;background:var(--line)}
.body{padding:0;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.body h3{margin:0}.body p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.card .btn{flex:none}
@media(max-width:560px){.card{flex-wrap:wrap}.card img{width:84px;height:84px}.body{flex:1 1 calc(100% - 110px)}.card .btn{width:100%}}.tag{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;color:#fff;background:var(--brand);cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:99px;padding:10px 14px;font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);background:linear-gradient(#4fc3f7,#039be5);box-shadow:0 5px 0 #0277bd,0 8px 14px rgba(0,0,0,.18)}
.ib .ic{display:inline-flex;width:32px;height:32px;border-radius:50%;background:#fff;align-items:center;justify-content:center;flex:none}.empty{grid-column:1/-1;text-align:center;color:var(--muted)}
#ov{display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;padding:20px;background:rgba(20,12,50,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none;overscroll-behavior:contain}
#ov.on{display:flex}
#ovc{position:relative;width:100%;max-width:340px;padding:28px 22px;border-radius:28px;text-align:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:ovIn .5s cubic-bezier(.2,.9,.3,1.2) both}
#ovx{position:absolute;top:10px;inset-inline-end:10px;width:32px;height:32px;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.28);cursor:pointer}
#ovx:hover{background:rgba(255,255,255,.42)}
#ovl{display:block;width:112px;height:112px;object-fit:contain;border-radius:26px;margin:0 auto 22px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
#ovb{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;margin:0 auto;padding:10px 26px;border:0;border-radius:99px;font:inherit;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(#ff8fb1,#ff4f87);box-shadow:0 5px 0 #c9336a,0 10px 18px rgba(0,0,0,.25);cursor:pointer;animation:ovP 1.6s ease-in-out infinite}
#ovb .ic{display:inline-flex;width:36px;height:36px;border-radius:50%;background:#fff;align-items:center;justify-content:center;flex:none;animation:ovB .9s ease-in-out infinite}
@keyframes ovIn{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes ovP{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes ovB{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){#ovc,#ovb,#ovb .ic{animation:none}}
</style><link rel="manifest" href="/api/manifest"></head><body>
<div id="ov"><div id="ovc"><button id="ovx" type="button" aria-label="إغلاق"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><img id="ovl" alt="" hidden><button id="ovb" type="button"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff4f87" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M6.5 10.5 12 16l5.5-5.5"/><path d="M5 20h14"/></svg></span><span>تثبيت</span></button></div></div>
<header id="hdr"><img id="logo" alt="" hidden><h1 id="nm"></h1></header>
<div class="chips" id="chips"></div><main id="grid"></main>
<script>
var D={site:{name:'متجر ألعاب الأطفال',desc:'',logo:'',tabs:[]},games:[]},cur='الكل';
fetch('games.json?'+Date.now()).then(r=>r.json()).then(d=>{
  if(Array.isArray(d))d={site:D.site,games:d};D=d;head();render()}).catch(()=>{head();render()});
function head(){var s=D.site;document.title=s.name;
  document.getElementById('nm').textContent=s.name;
  var ol=document.getElementById('ovl');if(s.logo){ol.src=s.logo;ol.hidden=false}
  var l=document.getElementById('logo');if(s.logo){l.src=s.logo;l.hidden=false;
    var f=document.querySelector('link[rel=icon]')||document.head.appendChild(Object.assign(document.createElement('link'),{rel:'icon'}));f.href=s.logo}}
/* نافذة تثبيت المتجر: تظهر فور فتح الصفحة (إلا إن كان مثبّتًا) */
var ov=document.getElementById('ov'),evp=null,ovT=null,
  standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function ovHide(){clearTimeout(ovT);ov.classList.remove('on')}
if(!standalone){
  ov.classList.add('on');
  ['click','mousedown','pointerdown','touchstart','touchmove','wheel','contextmenu'].forEach(function(t){
    ov.addEventListener(t,function(e){if(e.target===ov||t==='touchmove'||t==='wheel')e.preventDefault();e.stopPropagation()},{passive:false})});
  /* إن لم يتوفر التثبيت (مثبّت مسبقًا أو متصفح لا يدعمه) نُخفي النافذة كي لا تحجب المتجر */
  ovT=setTimeout(function(){if(!evp)ovHide()},6000)}
addEventListener('beforeinstallprompt',function(e){e.preventDefault();evp=e;clearTimeout(ovT)});
addEventListener('appinstalled',ovHide);
document.getElementById('ovx').onclick=ovHide;
document.getElementById('ovb').onclick=async function(){
  if(!evp)return;var ev=evp;evp=null;
  try{ev.prompt();await ev.userChoice}catch(err){}
  ovHide()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
function slug(u){try{return new URL(u).hostname.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}catch(e){return ''}}
var SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#039be5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">';
var IC_DL=SVG+'<path d="M12 4v11"/><path d="M6.5 10.5 12 16l5.5-5.5"/><path d="M5 20h14"/></svg>',IC_OK=SVG+'<path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function isInst(g){try{return localStorage.getItem('pk_inst_'+slug(g.url))==='1'}catch(e){return false}}
function install(g){var u='/play?id='+slug(g.url)+'&install=1',b=document.body;
  b.style.transition='opacity .45s ease';b.style.opacity='0';setTimeout(function(){location.href=u},450)}
addEventListener('pageshow',function(){document.body.style.opacity='1'});
addEventListener('storage',function(){render()});
addEventListener('scroll',function(){document.getElementById('hdr').classList.toggle('sm',scrollY>20)},{passive:true});
function render(){
  var tabs=['الكل'].concat(D.site.tabs||[]);
  var ch=document.getElementById('chips');ch.innerHTML='';
  tabs.forEach(a=>{var b=document.createElement('button');b.className='chip'+(a===cur?' on':'');b.textContent=a;b.onclick=()=>{cur=a;render()};ch.appendChild(b)});
  var gr=document.getElementById('grid');gr.innerHTML='';
  var L=D.games.filter(g=>cur==='الكل'||g.tab===cur);
  if(!L.length){gr.innerHTML='<p class="empty">لا توجد ألعاب بعد.</p>';return}
  L.forEach(g=>{
    var c=document.createElement('div');c.className='card';
    c.innerHTML='<img alt=""><div class="body"><h3></h3><p></p><div class="tag"></div></div><button class="btn"></button>';
    var im=c.querySelector('img');im.src=g.image||g.icon||'';im.onerror=()=>{im.style.visibility='hidden'};
    c.querySelector('h3').textContent=g.name;c.querySelector('p').textContent=g.desc;
    c.querySelector('.tag').textContent=g.tab||'';
    var b=c.querySelector('button');
    if(g.pwa){var inst=isInst(g);b.className='btn ib';
      b.innerHTML='<span class="ic"></span><span></span>';b.firstChild.innerHTML=inst?IC_OK:IC_DL;b.lastChild.textContent=inst?'مثبت':'تثبيت';b.onclick=()=>install(g)}else{b.textContent='غير مهيأة للتثبيت بعد';b.disabled=true}
    gr.appendChild(c)});
}
</script></body></html>
